<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recipe Desk</title>
<meta name="description" content="Your recipes in the box, and the admin's review queue.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f8f4ec; --card: #fffdf8; --ink: #2a241d; --muted: #776b5c; --line: #e7ddcb;
    --accent: #9c4a2f; --accent-ink: #ffffff; --chip: #efe6d4; --mark: #f3dfb8; --good: #3f7d4e; --bad: #b3392b;
    --field: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1814; --card: #24201b; --ink: #f1e9dc; --muted: #ad9f8b; --line: #3a332a;
      --accent: #e0896a; --accent-ink: #1b1814; --chip: #322b23; --mark: #4a3b22; --good: #7cc48d; --bad: #ff8a7a;
      --field: #1f1b17;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1b1814; --card: #24201b; --ink: #f1e9dc; --muted: #ad9f8b; --line: #3a332a;
    --accent: #e0896a; --accent-ink: #1b1814; --chip: #322b23; --mark: #4a3b22; --good: #7cc48d; --bad: #ff8a7a;
    --field: #1f1b17;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 Inter, system-ui, sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 32px 16px 80px; }
  h1, h2, h3 { font-family: Fraunces, Georgia, serif; font-weight: 700; margin: 0; line-height: 1.15; }
  h1 { font-size: clamp(28px, 5vw, 40px); }
  h2 { font-size: 21px; margin-bottom: 4px; }
  h3 { font-size: 18px; }
  a { color: var(--accent); }
  .back { display: inline-block; margin-bottom: 16px; text-decoration: none; }
  .lede { color: var(--muted); margin: 6px 0 0; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; margin-top: 18px; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 12px; }
  button, input, textarea { font: inherit; color: inherit; }
  textarea { width: 100%; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--field); resize: vertical; }
  button { cursor: pointer; border: 1px solid var(--line); background: var(--card); border-radius: 99px; padding: 6px 14px; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button:disabled { opacity: .45; cursor: default; }
  a.pill { display: inline-block; border: 1px solid var(--line); background: var(--card); border-radius: 99px; padding: 6px 14px; color: inherit; text-decoration: none; }
  a.pill:hover { border-color: var(--accent); }
  button:focus-visible, a:focus-visible, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .hint { font-size: 13px; color: var(--muted); margin: 6px 0 0; }
  [hidden] { display: none !important; }
  ul.rows { list-style: none; padding: 0; margin: 0; }
  .rows > li { padding: 14px 0; border-top: 1px solid var(--line); }
  .rows > li:first-child { border-top: 0; padding-top: 4px; }
  .rows .line { display: flex; gap: 6px 12px; flex-wrap: wrap; align-items: baseline; }
  .rows .who { color: var(--muted); font-size: 14px; }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .peek { font-size: 14px; color: var(--muted); margin: 6px 0 0; }
  .send-back { margin-top: 10px; }
  .fam-row { display: flex; gap: 8px 16px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
  .changes { font-size: 14px; margin: 6px 0 0; padding-left: 18px; }
  .changes li { margin: 2px 0; }
  .good { color: var(--good); }
  .toast { position: fixed; left: 50%; top: 20px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 99px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20; }
  .toast.show { opacity: 1; }
  footer { margin-top: 32px; font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  footer a { color: inherit; }
</style>
</head>
<body>
<main>
  <a class="back" href="./">← Recipe box</a>
  <h1>Recipe desk</h1>
  <p class="lede">Your recipes in the box, and for the admin: the review queue and the files for the public page.</p>
  <section><div id="auth"></div></section>
  <div id="desk"></div>
  <footer><span>Everything here is for the crew only. The public page changes only when the admin commits a family file.</span><a href="./">Recipe box</a></footer>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="core.js"></script>
<script src="cloud.js"></script>
<script>
(function () {
  const Cloud = window.RecipeCloud, { esc, loadFamilies, flatIngredients } = window.RecipeCore;
  const $ = id => document.getElementById(id);
  const desk = $('desk');
  let families = [];

  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 2200);
  }
  const when = iso => new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  const famName = id => (families.find(f => f.id === id) || { name: id }).name;
  const boxLink = r => './#/' + encodeURIComponent(r.family_id) + '/' + encodeURIComponent(r.slug);
  const editLink = r => 'edit.html?edit=' + encodeURIComponent(r.family_id + '/' + r.slug);
  const STATUS = { draft: 'Draft', submitted: 'Waiting for review', approved: 'In the box' };
  function download(name, text) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
    a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  async function load() {
    desk.innerHTML = '';
    if ((await Cloud.ready()) !== 'in') return;
    desk.innerHTML = '<section><p class="hint">Loading…</p></section>';
    families = await loadFamilies();
    await Cloud.overlay(families);
    draw();
  }

  function peek(row) {
    const r = Cloud.fromRow(row), n = flatIngredients(r).length, s = (r.steps || []).length;
    return n + ' ingredient' + (n === 1 ? '' : 's') + ' · ' + s + ' step' + (s === 1 ? '' : 's') + (r.from ? ' · from ' + esc(r.from) : '');
  }

  function draw() {
    const me = Cloud.me, rows = Cloud.allRows();
    const mine = rows.filter(r => r.created_by === me.id && !r.deleted_at && r.status !== 'approved');
    let html = '<section><h2>Your recipes</h2><p class="sub">Drafts and recipes waiting for review. Approved ones are in the box for everyone.</p>' +
      (mine.length ? '<ul class="rows">' + mine.map(r =>
        '<li><div class="line"><h3>' + esc(r.title) + '</h3><span class="rc-badge' + (r.status === 'draft' ? ' draft' : '') + '">' + STATUS[r.status] + '</span>' +
        '<span class="who">' + esc(famName(r.family_id)) + ' · ' + when(r.updated_at) + '</span></div>' +
        (r.review_note && r.status === 'draft' ? '<div class="rc-note"><b>From the review:</b> ' + esc(r.review_note) + '</div>' : '') +
        '<div class="btns"><a class="pill" href="' + editLink(r) + '">Edit</a><a class="pill" href="' + boxLink(r) + '">Open</a></div></li>').join('') + '</ul>'
        : '<p class="hint">Nothing waiting. <a href="edit.html">Add a recipe</a>, or <a href="import.html">add many at once</a>.</p>') + '</section>';

    if (me.admin) {
      const queue = rows.filter(r => r.status === 'submitted' && !r.deleted_at).sort((a, b) => a.updated_at.localeCompare(b.updated_at));
      html += '<section><h2>Waiting for review</h2><p class="sub">Approve to put it in the box, or send it back with a note. Approved recipes reach the public page when you commit the family file below.</p>' +
        (queue.length ? '<ul class="rows">' + queue.map(r =>
          '<li data-row="' + esc(r.id) + '"><div class="line"><h3>' + esc(r.title) + '</h3><span class="who">' + esc(famName(r.family_id)) + ' · by ' + esc(Cloud.nameOf(r.created_by)) + ' · ' + when(r.updated_at) + '</span></div>' +
          '<p class="peek">' + peek(r) + '</p>' +
          '<div class="btns"><button type="button" class="primary" data-act="approve">Approve</button><button type="button" data-act="back">Send back…</button>' +
          '<a class="pill" href="' + boxLink(r) + '">Read it</a><a class="pill" href="' + editLink(r) + '">Edit</a></div>' +
          '<div class="send-back" hidden><textarea rows="2" maxlength="500" placeholder="What needs changing? (they’ll see this)" aria-label="Note for the author"></textarea>' +
          '<div class="btns"><button type="button" class="primary" data-act="send">Send back</button><button type="button" data-act="cancel">Cancel</button></div></div></li>').join('') + '</ul>'
          : '<p class="hint good">All caught up.</p>') + '</section>';

      const drafts = rows.filter(r => r.status === 'draft' && !r.deleted_at && r.created_by !== me.id);
      if (drafts.length) html += '<section><h2>The crew’s drafts</h2><p class="sub">Still being worked on; only you and the author can see these.</p><ul class="rows">' +
        drafts.map(r => '<li><div class="line"><b>' + esc(r.title) + '</b><span class="who">' + esc(Cloud.nameOf(r.created_by)) + ' · ' + when(r.updated_at) + '</span></div></li>').join('') + '</ul></section>';

      // The public page: what each family file would gain, and the download
      const missing = families.reduce((n, f) => n + (f.fileRecipes || []).filter(r => !rows.some(x => x.family_id === f.id && x.slug === r.id)).length, 0);
      const listed = families.filter(f => !f.cloudOnly).map(f => f.id), extra = families.filter(f => f.cloudOnly);
      html += '<section><h2>The public page</h2><p class="sub">The family files in <code>recipes/data/</code> are what visitors see. Download a file, put it in that folder, then commit and push.</p><ul class="rows">' +
        families.map(f => {
          const { changes: c } = Cloud.familyFile(f);
          const n = c.added.length + c.changed.length + c.removed.length;
          return '<li><div class="fam-row"><div><b>' + esc(f.name) + '</b> <span class="who">' + esc(f.id) + '.json' + (f.cloudOnly ? ' · new family' : '') + '</span></div>' +
            '<button type="button"' + (n || f.cloudOnly ? ' class="primary"' : '') + ' data-dl="' + esc(f.id) + '">Download ' + esc(f.id) + '.json</button></div>' +
            (n ? '<ul class="changes">' +
              c.added.map(t => '<li>New: ' + esc(t) + '</li>').join('') + c.changed.map(t => '<li>Changed: ' + esc(t) + '</li>').join('') +
              c.removed.map(t => '<li>Removed: ' + esc(t) + '</li>').join('') + '</ul>'
              : '<p class="hint">' + (f.cloudOnly ? 'Not on the public page yet.' : 'The file already matches the box.') + '</p>') +
            (c.waiting ? '<p class="hint">' + c.waiting + ' more not approved yet (left out).</p>' : '') + '</li>';
        }).join('') + '</ul>' +
        (extra.length ? '<div class="btns"><button type="button" data-dl="__families">Download families.json</button></div><p class="hint">Needed for the new famil' + (extra.length === 1 ? 'y' : 'ies') + ': ' + extra.map(f => esc(f.name)).join(', ') + '.</p>' : '') +
        (missing ? '<div class="btns"><button type="button" id="import">Copy ' + missing + ' recipe' + (missing === 1 ? '' : 's') + ' from the files into the box</button></div>' +
          '<p class="hint">These are on the public page but not in the database yet. Copying them in lets the crew edit them and log cooking them.</p>' : '') +
        '</section>';

      const gone = rows.filter(r => r.deleted_at).sort((a, b) => b.deleted_at.localeCompare(a.deleted_at)).slice(0, 10);
      if (gone.length) html += '<section><h2>Recently removed</h2><ul class="rows">' + gone.map(r =>
        '<li data-row="' + esc(r.id) + '"><div class="fam-row"><span><b>' + esc(r.title) + '</b> <span class="who">' + esc(famName(r.family_id)) + ' · removed ' + when(r.deleted_at) + '</span></span>' +
        '<button type="button" data-act="restore">Put back</button></div></li>').join('') + '</ul></section>';
    }
    desk.innerHTML = html;
  }

  desk.addEventListener('click', async e => {
    const b = e.target.closest('button'); if (!b) return;
    const li = b.closest('[data-row]'), id = li && li.dataset.row;
    try {
      if (b.dataset.dl) {
        if (b.dataset.dl === '__families') {
          download('families.json', Cloud.pretty({ families: families.map(f => f.id) }));
          return;
        }
        const f = families.find(x => x.id === b.dataset.dl);
        download(f.id + '.json', Cloud.pretty(Cloud.familyFile(f).file));
        toast('Downloaded ' + f.id + '.json');
        return;
      }
      if (b.id === 'import') {
        b.disabled = true;
        const n = await Cloud.importFiles(families);
        toast('Copied ' + n + ' recipe' + (n === 1 ? '' : 's') + ' in');
        return load();
      }
      const act = b.dataset.act; if (!act) return;
      if (act === 'back') { li.querySelector('.send-back').hidden = false; li.querySelector('textarea').focus(); return; }
      if (act === 'cancel') { li.querySelector('.send-back').hidden = true; return; }
      b.disabled = true;
      if (act === 'approve') { await Cloud.setStatus(id, 'approved'); toast('Approved'); }
      if (act === 'send') { await Cloud.setStatus(id, 'draft', li.querySelector('textarea').value.trim()); toast('Sent back'); }
      if (act === 'restore') { await Cloud.restore(id); toast('Put back'); }
      load();
    } catch (x) { b.disabled = false; toast(Cloud.friendly(x)); }
  });

  Cloud.mountAuth($('auth'), { desk: false, pitch: 'Sign in to see your recipes (and, for the admin, the review queue).', onChange: () => load().catch(x => toast(Cloud.friendly(x))) });
  load().catch(x => { console.error(x); desk.innerHTML = '<section><p>' + esc(Cloud.friendly(x)) + '</p></section>'; });
})();
</script>
</body>
</html>
