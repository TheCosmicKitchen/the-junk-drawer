<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Recipes</title>
<meta name="description" content="Recipes from all the families, in one place.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f8f4ec;
    --card: #fffdf8;
    --ink: #2a241d;
    --muted: #776b5c;
    --line: #e7ddcb;
    --accent: #9c4a2f;
    --accent-ink: #ffffff;
    --chip: #efe6d4;
    --done: #a59886;
    --mark: #f3dfb8;
    --ring: #c0392b;
    --dock: #2a241d;
    --dock-ink: #f8f4ec;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1814; --card: #24201b; --ink: #f1e9dc; --muted: #ad9f8b; --line: #3a332a;
      --accent: #e0896a; --accent-ink: #1b1814; --chip: #322b23; --done: #6f6556; --mark: #4a3b22;
      --ring: #ff7a66; --dock: #f1e9dc; --dock-ink: #1b1814;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1b1814; --card: #24201b; --ink: #f1e9dc; --muted: #ad9f8b; --line: #3a332a;
    --accent: #e0896a; --accent-ink: #1b1814; --chip: #322b23; --done: #6f6556; --mark: #4a3b22;
    --ring: #ff7a66; --dock: #f1e9dc; --dock-ink: #1b1814;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 Inter, system-ui, sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 32px 16px 160px; }
  h1, h2, h3 { font-family: Fraunces, Georgia, serif; font-weight: 700; margin: 0; line-height: 1.15; }
  h1 { font-size: clamp(30px, 6vw, 46px); }
  a { color: var(--accent); }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; border: 1px solid var(--line); background: var(--card); border-radius: 99px; padding: 6px 14px; }
  button:hover { border-color: var(--accent); }
  button:focus-visible, input:focus, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  a.pill { display: inline-block; border: 1px solid var(--line); background: var(--card); border-radius: 99px; padding: 6px 14px; color: inherit; text-decoration: none; }
  a.pill:hover { border-color: var(--accent); }
  button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  [hidden] { display: none !important; }
  .muted { color: var(--muted); }

  /* ---- list ---- */
  .top { display: flex; justify-content: space-between; align-items: end; gap: 16px; flex-wrap: wrap; }
  .top p { margin: 6px 0 0; }
  .top .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .search { margin: 24px 0 12px; }
  .search input { width: 100%; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
  .card { position: relative; display: flex; flex-direction: column; gap: 6px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .card:hover, .card:focus-within { border-color: var(--accent); }
  .card.picked { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .card a.title { color: inherit; text-decoration: none; }
  .card a.title::after { content: ""; position: absolute; inset: 0; border-radius: 14px; }
  .card h3 { font-size: 20px; padding-right: 64px; }
  .card .fam { font-size: 13px; color: var(--accent); font-weight: 600; letter-spacing: .02em; padding-right: 64px; }
  .card p { margin: 0; font-size: 14px; color: var(--muted); }
  .card .pick { position: absolute; top: 12px; right: 12px; z-index: 1; font-size: 13px; padding: 4px 10px; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: auto; padding-top: 6px; }
  .tag { font-size: 12px; background: var(--chip); border-radius: 99px; padding: 2px 9px; color: var(--muted); text-decoration: none; }
  .empty { text-align: center; padding: 40px 0; }

  /* ---- recipe ---- */
  .back { display: inline-block; margin-bottom: 20px; text-decoration: none; }
  .r-head .fam { color: var(--accent); font-weight: 600; margin-bottom: 6px; }
  .meta { display: flex; gap: 6px 18px; flex-wrap: wrap; color: var(--muted); margin-top: 10px; font-size: 15px; }
  .intro { font-family: Fraunces, Georgia, serif; font-style: italic; font-size: 18px; margin: 18px 0 0; max-width: 62ch; }
  .tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 22px 0 6px; }
  .scale { display: inline-flex; align-items: center; gap: 6px; background: var(--card); border: 1px solid var(--line); border-radius: 99px; padding: 3px; }
  .scale button { border: 0; padding: 4px 11px; }
  .scale output { min-width: 7ch; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }
  .video { margin-top: 20px; aspect-ratio: 16 / 9; width: 100%; max-width: 720px; border-radius: 16px; overflow: hidden; background: #000; }
  .video iframe { width: 100%; height: 100%; border: 0; display: block; }
  .cols { display: grid; grid-template-columns: minmax(240px, 1fr) 1.6fr; gap: 28px; margin-top: 20px; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; align-self: start; }
  .panel h2 { font-size: 22px; margin-bottom: 10px; }
  .panel h3 { font-size: 15px; font-family: Inter, system-ui, sans-serif; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 0 6px; }
  .panel h2 + h3 { margin-top: 4px; }
  ul.ing, ol.steps { list-style: none; padding: 0; margin: 0; }
  .ing li, .steps li { cursor: pointer; border-radius: 8px; user-select: none; }
  .ing li { display: flex; gap: 10px; padding: 6px 6px; }
  .ing li::before { content: ""; flex: none; width: 16px; height: 16px; margin-top: 4px; border: 1.5px solid var(--muted); border-radius: 4px; }
  .ing li.done { color: var(--done); text-decoration: line-through; }
  .ing li.done::before { background: var(--done); border-color: var(--done); }
  .qty { font-weight: 600; }
  .scaled .qty { background: var(--mark); border-radius: 4px; padding: 0 3px; }
  .qty.conv { text-decoration: underline dotted; text-underline-offset: 3px; cursor: help; }
  ol.steps { counter-reset: step; }
  .steps li { counter-increment: step; display: grid; grid-template-columns: 34px 1fr; gap: 10px; padding: 10px 6px; }
  .steps li::before { content: counter(step); font-family: Fraunces, Georgia, serif; font-weight: 700; font-size: 20px; color: var(--accent); line-height: 1.3; }
  .steps li.done { color: var(--done); }
  .steps li.done::before { content: "✓"; color: var(--done); }
  .steps li.next { background: var(--chip); }
  button.tmr { display: inline; padding: 0 8px; margin: 0 1px; border-radius: 6px; border: 1px solid var(--accent); color: var(--accent); background: transparent; font-weight: 600; white-space: nowrap; line-height: 1.4; }
  button.tmr::before { content: "⏱ "; }
  button.tmr:hover { background: var(--accent); color: var(--accent-ink); }
  .notes { margin-top: 20px; padding: 14px 16px; border-left: 3px solid var(--accent); background: var(--card); border-radius: 0 12px 12px 0; }
  .notes p { margin: 0; }
  .hint { font-size: 13px; color: var(--muted); margin: 8px 0 0; }
  .r-tags { margin-top: 24px; }
  /* ---- collections: a light tint of the collection's hue over the whole page ---- */
  :root[data-collection] {
    --bg: hsl(var(--hue) 55% 95%); --card: hsl(var(--hue) 60% 98.5%); --line: hsl(var(--hue) 35% 85%);
    --accent: hsl(var(--hue) 55% 37%); --chip: hsl(var(--hue) 45% 90%); --mark: hsl(var(--hue) 70% 86%);
  }
  @media (prefers-color-scheme: dark) {
    :root[data-collection]:not([data-theme="light"]) {
      --bg: hsl(var(--hue) 22% 10%); --card: hsl(var(--hue) 20% 14%); --line: hsl(var(--hue) 18% 25%);
      --accent: hsl(var(--hue) 70% 70%); --chip: hsl(var(--hue) 22% 20%); --mark: hsl(var(--hue) 35% 26%);
    }
  }
  :root[data-theme="dark"][data-collection] {
    --bg: hsl(var(--hue) 22% 10%); --card: hsl(var(--hue) 20% 14%); --line: hsl(var(--hue) 18% 25%);
    --accent: hsl(var(--hue) 70% 70%); --chip: hsl(var(--hue) 22% 20%); --mark: hsl(var(--hue) 35% 26%);
  }
  :root[data-collection] body { background: radial-gradient(1100px 420px at 50% -120px, hsl(var(--hue) 75% 80% / .45), transparent 70%) no-repeat, var(--bg); }
  .coll-head { position: relative; padding: 8px 0 22px; }
  .coll-head::after { content: attr(data-emoji); position: absolute; right: 0; top: -12px; font-size: clamp(64px, 14vw, 120px); line-height: 1; opacity: .22; pointer-events: none; }
  .coll-head h1, .coll-head p { position: relative; z-index: 1; max-width: calc(100% - 90px); }
  .coll-head p { margin: 8px 0 0; }
  .colls { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 22px; }
  .coll { display: flex; align-items: center; gap: 10px; padding: 10px 16px 10px 12px; border-radius: 14px; text-decoration: none; color: var(--ink);
    background: hsl(var(--hue) 60% 93%); border: 1px solid hsl(var(--hue) 40% 82%); }
  .coll:hover { border-color: hsl(var(--hue) 55% 45%); }
  .coll-emoji { font-size: 26px; line-height: 1; }
  .coll b { display: block; font-family: Fraunces, Georgia, serif; font-size: 17px; }
  .coll small { color: var(--muted); font-size: 12px; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .coll { background: hsl(var(--hue) 22% 16%); border-color: hsl(var(--hue) 20% 28%); }
  }
  :root[data-theme="dark"] .coll { background: hsl(var(--hue) 22% 16%); border-color: hsl(var(--hue) 20% 28%); }
  .r-head .meta .rc-badge { align-self: center; }
  .rc-note { max-width: 62ch; }
  .crew { margin-top: 24px; }
  .cooked { margin-top: 24px; }
  ul.cooks { list-style: none; padding: 0; margin: 0; }
  .cooks li { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .cooks li:last-child { border-bottom: 0; }
  .cook-note { flex-basis: 100%; }
  .cooks .x { margin-left: auto; border: 0; padding: 0 6px; color: var(--muted); background: transparent; }
  .cook-form { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .cook-form input { padding: 7px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); min-width: 0; }
  .cook-form #cookNote { flex: 1 1 220px; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }

  /* ---- grocery list ---- */
  .picked-list { display: flex; flex-direction: column; gap: 8px; margin: 18px 0 8px; }
  .picked-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; }
  .picked-row a { font-weight: 600; text-decoration: none; color: inherit; flex: 1; min-width: 12ch; }
  .picked-row .rm { font-size: 13px; padding: 4px 10px; }
  ul.groc { list-style: none; padding: 0; margin: 0; columns: 2 280px; column-gap: 28px; }
  .groc li { break-inside: avoid; display: flex; gap: 10px; padding: 7px 6px; border-radius: 8px; cursor: pointer; user-select: none; }
  .groc li::before { content: ""; flex: none; width: 16px; height: 16px; margin-top: 4px; border: 1.5px solid var(--muted); border-radius: 4px; }
  .groc li.done { color: var(--done); text-decoration: line-through; }
  .groc li.done::before { background: var(--done); border-color: var(--done); }
  .groc small { display: block; color: var(--muted); font-size: 12px; text-decoration: none; }

  footer { margin-top: 40px; font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  footer a { color: inherit; }

  /* ---- dock: grocery bar + timers, pinned to the bottom ---- */
  .dock { position: fixed; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 10; }
  .dock-in { max-width: 960px; margin: 0 auto; padding: 0 16px 16px; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .dock-in > * { pointer-events: auto; }
  .timer { display: flex; align-items: center; gap: 10px; background: var(--dock); color: var(--dock-ink); border-radius: 14px; padding: 8px 8px 8px 14px; box-shadow: 0 6px 20px rgba(0,0,0,.25); max-width: 100%; }
  .timer .lbl { font-size: 13px; opacity: .8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 26ch; }
  .timer b { font-variant-numeric: tabular-nums; font-size: 20px; min-width: 5ch; text-align: right; }
  .timer button { background: transparent; color: inherit; border-color: currentColor; padding: 3px 10px; font-size: 13px; }
  .timer.paused b { opacity: .55; }
  .timer.ring { background: var(--ring); color: #fff; animation: shake .5s infinite; }
  @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
  @media (prefers-reduced-motion: reduce) { .timer.ring { animation: none; } }
  .basket { display: flex; align-items: center; gap: 12px; background: var(--accent); color: var(--accent-ink); border-radius: 14px; padding: 10px 10px 10px 16px; text-decoration: none; font-weight: 600; box-shadow: 0 6px 20px rgba(0,0,0,.2); }
  .basket span { background: var(--accent-ink); color: var(--accent); border-radius: 10px; padding: 2px 10px; }

  .toast { position: fixed; left: 50%; top: 20px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 99px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20; }
  .toast.show { opacity: 1; }

  @media (max-width: 700px) { .cols { grid-template-columns: 1fr; } .timer .lbl { max-width: 14ch; } }
  @media print {
    body { background: #fff; color: #000; }
    main { padding-bottom: 0; }
    .tools, .back, footer, .search, .chips, .toast, .dock, .video, .no-print { display: none !important; }
    .panel { border: 0; padding: 0; }
    .cols { grid-template-columns: 1fr 1.5fr; }
    .ing li.done, .steps li.done, .groc li.done { color: #000; text-decoration: none; }
    .steps li.next { background: none; }
    .scaled .qty { background: none; }
    button.tmr { border: 0; color: #000; padding: 0; font-weight: inherit; }
    button.tmr::before { content: ""; }
  }
</style>
</head>
<body>
<main id="app"><p class="muted">Loading recipes…</p></main>
<div class="dock"><div class="dock-in" id="dock"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="core.js"></script>
<script src="cloud.js"></script>
<script>
(function () {
  const Cloud = window.RecipeCloud;
  const app = document.getElementById('app');
  const { esc, LEAD, parseNum, niceNum, WORDS, unitInfo, unitText, pluralWord, singularWord, parseIng, countedName, ML, G, METRIC, density, pickUnit, unitNum, measure, isMeasure, sysOf, SHOW, flatIngredients, youtube, convertTextFor } = window.RecipeCore;
  let families = [];   // [{ id, name, about, recipes: [...] }]
  let all = [];        // flat list of recipes, each with .family and .key
  const ui = { q: '', fam: 'all' };

  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 1800);
  }
  // per-browser storage; everything still works if it's blocked
  const store = {
    get(k, d) { try { const v = JSON.parse(localStorage.getItem('recipes.' + k)); return v == null ? d : v; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('recipes.' + k, JSON.stringify(v)); } catch (e) {} },
  };

  // Quantities, units, conversions and YouTube links live in core.js.
  let units = store.get('units', 'orig');   // 'orig' (as written), 'us' or 'metric'
  if (!['orig', 'us', 'metric'].includes(units)) units = 'orig';
  function setUnits(u) {
    units = u; store.set('units', u);
    document.querySelectorAll('[data-units]').forEach(b => b.setAttribute('aria-pressed', b.dataset.units === u));
  }
  const unitsToggle = () => '<span class="scale" role="group" aria-label="Units">' +
    [['orig', 'As written'], ['us', 'US'], ['metric', 'Metric']].map(([k, l]) =>
      '<button type="button" data-units="' + k + '" aria-pressed="' + (units === k) + '">' + l + '</button>').join('') + '</span>';

  const convertText = text => convertTextFor(text, units);
  function ingredientHTML(line, factor) {
    const p = parseIng(line);
    if (p.q1 == null) return esc(line);
    if (isMeasure(p)) {
      const src = sysOf(p.info.canon), target = units === 'orig' ? src : units;
      if (factor !== 1 || target !== src) {
        const per = ML[p.info.canon] || G[p.info.canon], dim = ML[p.info.canon] ? 'vol' : 'wt';
        const m = measure(dim, p.q1 * factor * per, p.q2 != null ? p.q2 * factor * per : null, target, p.name, target !== src);
        const changed = m.unit !== p.info.canon || m.approx;
        return '<span class="qty' + (changed ? ' conv" title="' + esc('As written: ' + line + (m.approx ? ' (converted by weight per cup, so roughly)' : '')) : '') + '">' +
          esc((m.approx ? '≈' : '') + m.text) + '</span> ' + esc(p.name);
      }
    }
    const a = p.q1 * factor, b = p.q2 != null ? p.q2 * factor : null;
    const top = b != null ? b : a;
    const qty = niceNum(a) + (b != null ? '–' + niceNum(b) : '');
    const unit = p.info ? unitText(p.unitRaw, p.info, top) : '';
    const name = p.info ? p.name : (factor === 1 ? p.name : countedName(p.name, top));
    return '<span class="qty">' + esc(qty + (unit ? ' ' + p.pre + unit : '')) + '</span> ' + esc(name);
  }

  // =====================================================================
  // Data
  // =====================================================================
  async function load() {
    const [fs, cs] = await Promise.all([
      window.RecipeCore.loadFamilies(),
      fetch('data/collections.json', { cache: 'no-cache' }).then(r => r.ok ? r.json() : { collections: [] }).catch(() => ({ collections: [] })),
    ]);
    families = fs;
    collections = (cs.collections || []).filter(c => c && c.id && c.tag && c.name);
    try { await Cloud.overlay(families); }
    catch (e) { console.error(e); toast('Couldn’t load the newest recipes: ' + Cloud.friendly(e)); }
    all = [];
    for (const f of families) for (const r of f.recipes) all.push(Object.assign({}, r, { family: f, key: f.id + '/' + r.id }));
    all.sort((a, b) => a.title.localeCompare(b.title));
  }
  const byKey = k => all.find(r => r.key === k);
  const link = r => '#/' + encodeURIComponent(r.family.id) + '/' + encodeURIComponent(r.id);

  // =====================================================================
  // Grocery basket: { "family/recipe": factor }
  // =====================================================================
  let basket = store.get('basket', {});
  function saveBasket() { store.set('basket', basket); drawDock(); }
  function toggleBasket(r, factor) {
    if (basket[r.key]) delete basket[r.key]; else basket[r.key] = factor || 1;
    saveBasket();
  }
  const basketCount = () => Object.keys(basket).filter(byKey).length;


  // =====================================================================
  // Timers
  // =====================================================================
  // Spot "5 minutes", "18 to 20 minutes", "an hour", "1½ hours", "30 sec" in a step.
  const WORDNUM = { a: 1, an: 1, one: 1, two: 2, three: 3, four: 4, five: 5, six: 6, ten: 10, fifteen: 15, twenty: 20, thirty: 30, 'half an': .5, 'half a': .5 };
  const TIME_RE = /\b(\d+\s+\d+\/\d+|\d+\/\d+|\d+(?:\.\d+)?\s?½?|½|half an?|an?|one|two|three|four|five|six|ten|fifteen|twenty|thirty)(?:\s*(?:-|–|to|or)\s*(\d+(?:\.\d+)?))?\s*(hours?|hrs?|minutes?|mins?|seconds?|secs?)\b/gi;
  function timeNum(s) {
    s = s.toLowerCase().trim();
    if (s in WORDNUM) return WORDNUM[s];
    return parseNum(s);
  }
  const UNIT_SEC = u => /^h/i.test(u) ? 3600 : /^m/i.test(u) ? 60 : 1;
  function stepHTML(text) {
    let out = '', last = 0, m;
    TIME_RE.lastIndex = 0;
    while ((m = TIME_RE.exec(text))) {
      const secs = Math.round(timeNum(m[1]) * UNIT_SEC(m[3]));
      if (!secs) continue;
      out += esc(text.slice(last, m.index)) +
        '<button type="button" class="tmr" data-sec="' + secs + '" title="Start a ' + esc(fmtDur(secs)) + ' timer">' + esc(m[0]) + '</button>';
      last = m.index + m[0].length;
    }
    return out + esc(text.slice(last));
  }
  function fmtDur(s) {
    const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
    return [h && h + ' hr', m && m + ' min', x && x + ' sec'].filter(Boolean).join(' ');
  }
  function clock(ms) {
    const s = Math.max(0, Math.ceil(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
    return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0');
  }

  // Each timer: { id, label, end (ms timestamp) | left (ms, while paused), state: 'run' | 'pause' | 'ring' }
  let timers = store.get('timers', []).filter(t => t && t.id);
  let audio = null;
  function unlockAudio() {
    try { if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)(); if (audio.state === 'suspended') audio.resume(); } catch (e) {}
  }
  function beep() {
    if (!audio) return;
    try {
      const t0 = audio.currentTime;
      [0, .25, .5].forEach(d => {
        const o = audio.createOscillator(), g = audio.createGain();
        o.frequency.value = 880; o.connect(g); g.connect(audio.destination);
        g.gain.setValueAtTime(.0001, t0 + d); g.gain.exponentialRampToValueAtTime(.3, t0 + d + .02); g.gain.exponentialRampToValueAtTime(.0001, t0 + d + .18);
        o.start(t0 + d); o.stop(t0 + d + .2);
      });
    } catch (e) {}
  }
  function saveTimers() { store.set('timers', timers); }
  function addTimer(secs, label) {
    unlockAudio();
    timers.push({ id: Date.now() + '' + Math.random().toString(36).slice(2, 6), label, end: Date.now() + secs * 1000, state: 'run' });
    saveTimers(); drawDock(); tick();
    toast(fmtDur(secs) + ' timer started');
  }
  let ticking = null, lastBeep = 0, baseTitle = document.title;
  function tick() {
    const now = Date.now();
    let ringing = false;
    for (const t of timers) {
      if (t.state === 'run' && now >= t.end) {
        t.state = 'ring'; saveTimers(); drawDock();
        try { navigator.vibrate && navigator.vibrate([300, 150, 300, 150, 300]); } catch (e) {}
      }
      if (t.state === 'ring') ringing = true;
      const el = document.querySelector('[data-timer="' + t.id + '"] b');
      if (el) el.textContent = t.state === 'ring' ? 'Done!' : clock(t.state === 'pause' ? t.left : t.end - now);
    }
    if (ringing && now - lastBeep > 1500) { beep(); lastBeep = now; }
    document.title = (ringing ? '⏰ ' : '') + baseTitle;
    clearTimeout(ticking);
    if (timers.length) ticking = setTimeout(tick, 250);
  }

  function drawDock() {
    const dock = document.getElementById('dock');
    const n = basketCount();
    const onList = location.hash.startsWith('#/list');
    dock.innerHTML =
      timers.map(t =>
        '<div class="timer ' + (t.state === 'ring' ? 'ring' : t.state === 'pause' ? 'paused' : '') + '" data-timer="' + t.id + '" role="timer">' +
          '<span class="lbl" title="' + esc(t.label) + '">' + esc(t.label) + '</span><b></b>' +
          (t.state === 'ring'
            ? '<button type="button" data-t="stop">Stop</button>'
            : '<button type="button" data-t="pause">' + (t.state === 'pause' ? 'Resume' : 'Pause') + '</button><button type="button" data-t="stop" aria-label="Cancel timer">✕</button>') +
        '</div>').join('') +
      (n && !onList ? '<a class="basket" href="#/list">Grocery list <span>' + n + ' recipe' + (n === 1 ? '' : 's') + '</span></a>' : '');
    tick();
  }
  document.getElementById('dock').addEventListener('click', e => {
    const b = e.target.closest('button[data-t]'); if (!b) return;
    const id = b.closest('[data-timer]').dataset.timer;
    const t = timers.find(x => x.id === id); if (!t) return;
    if (b.dataset.t === 'stop') timers = timers.filter(x => x !== t);
    else if (t.state === 'pause') { t.end = Date.now() + t.left; t.state = 'run'; delete t.left; unlockAudio(); }
    else { t.left = t.end - Date.now(); t.state = 'pause'; }
    saveTimers(); drawDock();
  });
  function askTimer(label) {
    const v = prompt('Timer length in minutes (e.g. 12 or 1.5):', '10');
    if (v == null) return;
    const mins = parseFloat(v);
    if (!(mins > 0)) { toast('That isn’t a number of minutes'); return; }
    addTimer(Math.round(mins * 60), label);
  }

    const hay = [r.title, r.from, r.family.name, r.intro, (r.tags || []).join(' '), flatIngredients(r).join(' ')].join(' ').toLowerCase();
    return q.toLowerCase().split(/\s+/).every(w => hay.includes(w));
  }
  const visible = () => all.filter(r => (ui.fam === 'all' || r.family.id === ui.fam) && matches(r, ui.q));
  function renderList() {
    baseTitle = 'Family Recipes';
    const broken = families.filter(f => f.broken);
    app.innerHTML =
      '<div class="top"><div><h1>Family Recipes</h1><p class="muted">' + all.length + ' recipes from ' + families.length + ' famil' + (families.length === 1 ? 'y' : 'ies') + '</p></div>' +
      '<div class="btns"><a class="pill" href="edit.html">+ Add a recipe</a><a class="pill" href="import.html">Add many</a><button type="button" id="newTimer">⏱ Timer</button><button type="button" id="surprise">Surprise me</button></div></div>' +
      (broken.length ? '<p class="muted">Couldn’t read: ' + broken.map(f => esc(f.broken)).join(', ') + '</p>' : '') +
      (collections.length ? '<div class="colls">' + collections.map(c => {

          '<span><b>' + esc(c.name) + '</b><small>' + n + ' recipe' + (n === 1 ? '' : 's') + '</small></span></a>';
      }).join('') + '</div>' : '') +
      '<div class="search"><input id="q" type="search" placeholder="Search recipes, ingredients, tags…" aria-label="Search recipes" value="' + esc(ui.q) + '"></div>' +
      '<div class="chips" role="group" aria-label="Filter by family">' +
        '<button type="button" data-fam="all" aria-pressed="' + (ui.fam === 'all') + '">All families</button>' +
        families.map(f => '<button type="button" data-fam="' + esc(f.id) + '" aria-pressed="' + (ui.fam === f.id) + '" title="' + esc(f.about) + '">' + esc(f.name) + '</button>').join('') +
      '</div>' +
      '<div class="grid" id="grid"></div>' +
      '<p class="hint">Tap “+ List” on a few recipes to build one grocery list for all of them.</p>' +
      '<div class="panel crew" id="crew"></div>' +
      '<footer><span>Want a recipe added? Send it over.</span><a href="../">Junk drawer</a></footer>';
    mountCrew(document.getElementById('crew'));
    drawCards();
    const q = document.getElementById('q');
    q.addEventListener('input', () => { ui.q = q.value; drawCards(); });
    app.querySelector('.chips').addEventListener('click', e => {
      const b = e.target.closest('button[data-fam]'); if (!b) return;

      : '<p class="muted empty" style="grid-column:1/-1">No recipes match that.</p>';

      return '<div class="card' + (on ? ' picked' : '') + '">' +
        '<button type="button" class="pick" data-key="' + esc(r.key) + '" aria-pressed="' + on + '" aria-label="' + (on ? 'Remove ' : 'Add ') + esc(r.title) + (on ? ' from' : ' to') + ' grocery list">' + (on ? '✓ List' : '+ List') + '</button>' +

  // =====================================================================
  // Recipe view
  // =====================================================================
  let wake = null, wantWake = false;
  async function setWake(on) {
    try {
      if (on) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; syncWake(); }); }
      else if (wake) { await wake.release(); wake = null; }
    } catch (e) { wake = null; if (on) toast('Your browser won’t keep the screen on'); }
    syncWake();
  }
  function syncWake() { const b = document.getElementById('wake'); if (b) b.setAttribute('aria-pressed', !!wake); }
  document.addEventListener('visibilitychange', () => {
    // the browser drops the lock when you switch away; take it back when you return
    if (document.visibilityState === 'visible' && wantWake && document.getElementById('wake')) setWake(true);
  });

  function renderRecipe(famId, recId) {
    const r = all.find(x => x.family.id === famId && x.id === recId);
    if (!r) {
      baseTitle = 'Recipe not found · Family Recipes';
      app.innerHTML = '<a class="back" href="#/">← All recipes</a><h1>Recipe not found</h1><p class="muted">It may have been renamed or moved' +
        (Cloud.state === 'in' ? '.' : ', or it may still be waiting for review. Recipes show up for everyone once they’re approved.') + '</p>';
      return;
    }
    baseTitle = r.title + ' · Family Recipes';
    const groups = Array.isArray(r.ingredients) ? [['', r.ingredients]] : Object.entries(r.ingredients || {});
    const base = Number(r.serves) || 0;
    const unit = r.unit || (base === 1 ? 'serving' : 'servings');
    let factor = basket[r.key] || 1;
    let count = base ? Math.max(1, Math.round(base * factor)) : 0;
    if (base) factor = count / base;
    const video = r.video && youtube(r.video);

    app.innerHTML =
      '<a class="back" href="#/">← All recipes</a>' +
      '<div class="r-head"><div class="fam">' + esc(r.family.name) + '</div><h1>' + esc(r.title) + '</h1>' +
        '<div class="meta">' +
          (r.from ? '<span>From ' + esc(r.from) + '</span>' : '') +
          (base ? '<span>Makes ' + base + ' ' + esc(unit) + '</span>' : '') +
          (r.time ? '<span>' + esc(r.time) + '</span>' : '') +
        '</div>' +
        (r.intro ? '<p class="intro">' + esc(r.intro) + '</p>' : '') +
        (r.cloud && (Cloud.badge(r) || r.cloud.byName) ? '<p class="meta">' + Cloud.badge(r) + (r.cloud.byName ? '<span>Added by ' + esc(r.cloud.byName) + '</span>' : '') + '</p>' : '') +
        (r.cloud && r.cloud.note && r.cloud.status === 'draft' ? '<div class="rc-note no-print"><b>From the review:</b> ' + esc(r.cloud.note) + '</div>' : '') +
      '</div>' +
      '<div class="tools">' +
        (base
          ? '<span class="scale" aria-label="Servings"><button type="button" data-step="-1" aria-label="Fewer">−</button><output id="count"></output><button type="button" data-step="1" aria-label="More">+</button></span>'
          : '<span class="scale" role="group" aria-label="Batch size">' + [0.5, 1, 2, 3].map(f => '<button type="button" data-factor="' + f + '" aria-pressed="' + (f === factor) + '">' + (f === 0.5 ? '½' : f) + '×</button>').join('') + '</span>') +
        unitsToggle() +
        '<button type="button" id="pick"></button>' +
        '<button type="button" id="timer">⏱ Timer</button>' +
        ('wakeLock' in navigator ? '<button type="button" id="wake" aria-pressed="false" title="Stops your screen going dark while you cook">Keep screen on</button>' : '') +
        '<button type="button" id="share">Copy link</button>' +
        '<button type="button" id="print">Print</button>' +
        '<a class="pill" href="edit.html?edit=' + encodeURIComponent(r.key) + '">Edit</a>' +
        '<button type="button" id="reset" hidden>Clear ticks</button>' +
      '</div>' +
      (video ? '<div class="video"><iframe src="' + esc(video) + '" title="Video: ' + esc(r.title) + '" loading="lazy" allow="encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>' : '') +
      '<div class="cols">' +
        '<div class="panel" id="ingPanel"><h2>Ingredients</h2><div id="ings"></div><p class="hint">Tap things off as you go.</p></div>' +
        '<div class="panel"><h2>Method</h2><ol class="steps" id="steps"></ol>' +
          (/class="tmr"/.test((r.steps || []).map(stepHTML).join('')) ? '<p class="hint">Tap a ⏱ time to start a timer.</p>' : '') + '</div>' +
      '</div>' +
      (r.notes ? '<div class="notes"><p><strong>Notes.</strong> <span id="notes"></span></p></div>' : '') +
      (r.tags && r.tags.length ? '<div class="tags r-tags">' + r.tags.map(t => {
        const c = collections.find(x => x.tag.toLowerCase() === t.toLowerCase());
        return c ? '<a class="tag" href="#/c/' + encodeURIComponent(c.id) + '">' + esc((c.emoji ? c.emoji + ' ' : '') + c.name) + '</a>'
          : '<a class="tag" href="#/" data-tag="' + esc(t) + '">' + esc(t) + '</a>';
      }).join('') + '</div>' : '') +
      (Cloud.state === 'in' ? '<div class="panel cooked no-print" id="cooked"><h2>Made it</h2><div id="cookList"><p class="hint">Loading…</p></div>' +
        '<form id="cookForm" class="cook-form"><input id="cookNote" maxlength="280" placeholder="How did it go? (optional)" aria-label="Note">' +
        '<input id="cookOn" type="date" aria-label="When"><button type="submit" class="primary">I made this</button></form></div>' : '') +
      '<footer><span>' + esc(r.family.name) + (r.family.about ? ' · ' + esc(r.family.about) : '') + '</span><a href="../">Junk drawer</a></footer>';

    const ticked = new Set();
    function syncPick() {
      const b = document.getElementById('pick'), on = !!basket[r.key];
      b.setAttribute('aria-pressed', on);
      b.textContent = on ? '✓ On grocery list' : '+ Grocery list';
    }
    function drawIngs() {
      let k = 0;
      document.getElementById('ings').innerHTML = groups.map(([name, items]) =>
        (name ? '<h3>' + esc(name) + '</h3>' : '') +
        '<ul class="ing">' + items.map(line => { const id = k++; return '<li data-k="' + id + '" class="' + (ticked.has('i' + id) ? 'done' : '') + '">' +
          '<span>' + ingredientHTML(line, factor) + '</span></li>'; }).join('') + '</ul>').join('');
      document.getElementById('ingPanel').classList.toggle('scaled', factor !== 1);
      const c = document.getElementById('count');
      if (c) c.textContent = count + ' ' + (r.unit || (count === 1 ? 'serving' : 'servings'));
      if (basket[r.key]) { basket[r.key] = factor; saveBasket(); }
    }
    function drawText() {
      document.getElementById('steps').innerHTML = (r.steps || []).map(s => '<li><span>' + stepHTML(convertText(s)) + '</span></li>').join('');
      const n = document.getElementById('notes');
      if (n) n.textContent = convertText(r.notes);
      syncSteps();
    }
    function syncSteps() {
      let nextMarked = false;
      document.querySelectorAll('#steps li').forEach((li, i) => {
        const done = ticked.has('s' + i);
        li.classList.toggle('done', done);
        li.classList.toggle('next', !done && !nextMarked && ticked.size > 0 && (nextMarked = true));
      });
      document.getElementById('reset').hidden = ticked.size === 0;
    }
    drawIngs(); drawText(); syncPick();

    app.querySelector('.tools').addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      if (b.dataset.units) {
        setUnits(b.dataset.units); drawIngs(); drawText();
      } else if (b.dataset.step) {
        count = Math.max(1, count + Number(b.dataset.step));
        factor = count / base; drawIngs();
      } else if (b.dataset.factor) {
        factor = Number(b.dataset.factor);
        app.querySelectorAll('[data-factor]').forEach(x => x.setAttribute('aria-pressed', x === b));
        drawIngs();
      } else if (b.id === 'pick') {
        toggleBasket(r, factor); syncPick();
        toast(basket[r.key] ? 'Added to the grocery list' : 'Taken off the grocery list');
      } else if (b.id === 'timer') {
        askTimer(r.title);
      } else if (b.id === 'wake') {
        wantWake = !wake; setWake(wantWake);
      } else if (b.id === 'share') {
        const url = location.href;
        (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject())
          .then(() => toast('Link copied'), () => prompt('Copy this link:', url));
      } else if (b.id === 'print') {
        window.print();
      } else if (b.id === 'reset') {
        ticked.clear(); drawIngs(); syncSteps();
      }
    });
    document.getElementById('ings').addEventListener('click', e => {
      const li = e.target.closest('li[data-k]'); if (!li) return;
      const k = 'i' + li.dataset.k;
      ticked.has(k) ? ticked.delete(k) : ticked.add(k);
      li.classList.toggle('done', ticked.has(k));
      document.getElementById('reset').hidden = ticked.size === 0;
    });
    document.getElementById('steps').addEventListener('click', e => {
      const t = e.target.closest('button.tmr');
      const li = e.target.closest('li'); if (!li) return;
      const n = [...li.parentNode.children].indexOf(li);
      if (t) { addTimer(Number(t.dataset.sec), r.title + ' · step ' + (n + 1)); return; }
      const k = 's' + n;
      ticked.has(k) ? ticked.delete(k) : ticked.add(k);
      syncSteps();
    });
    app.querySelectorAll('[data-tag]').forEach(a => a.addEventListener('click', () => { ui.q = a.dataset.tag; ui.fam = 'all'; }));
    syncWake();
    if (document.getElementById('cooked')) drawCooks(r);
  }

  // =====================================================================
  // "Made it": the crew's log for a recipe (signed in only)
  // =====================================================================
  const isoToday = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
  const niceDate = iso => new Date(iso + 'T12:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: iso.slice(0, 4) === isoToday().slice(0, 4) ? undefined : 'numeric' });
  async function drawCooks(r) {
    const list = document.getElementById('cookList'), form = document.getElementById('cookForm');
    const on = document.getElementById('cookOn');
    on.value = isoToday(); on.max = isoToday();
    async function refresh() {
      try {
        const cs = await Cloud.cooks(r.family.id, r.id);
        if (!document.body.contains(list)) return;
        list.innerHTML = cs.length
          ? '<ul class="cooks">' + cs.map(c => '<li><b>' + esc(c.name) + '</b> <span class="muted">' + esc(niceDate(c.cooked_on)) + '</span>' +
              (c.note ? '<span class="cook-note">' + esc(c.note) + '</span>' : '') +
              (c.mine ? '<button type="button" class="x" data-cook="' + esc(c.id) + '" aria-label="Remove">✕</button>' : '') + '</li>').join('') + '</ul>' +
            '<p class="hint">Made ' + cs.length + ' time' + (cs.length === 1 ? '' : 's') + ' by the crew.</p>'
          : '<p class="hint">Nobody’s logged this one yet.</p>';
      } catch (e) { list.innerHTML = '<p class="hint">' + esc(Cloud.friendly(e)) + '</p>'; }
    }
    list.addEventListener('click', async e => {
      const b = e.target.closest('[data-cook]'); if (!b) return;
      try { await Cloud.removeCook(b.dataset.cook); refresh(); } catch (x) { toast(Cloud.friendly(x)); }
    });
    form.addEventListener('submit', async e => {
      e.preventDefault();
      const btn = form.querySelector('button'); btn.disabled = true;
      try {
        await Cloud.addCook(r.family.id, r.id, document.getElementById('cookNote').value.trim(), on.value || null);
        document.getElementById('cookNote').value = ''; toast('Logged. Nice!'); refresh();
      } catch (x) { toast(Cloud.friendly(x)); }
      btn.disabled = false;
    });
    refresh();
  }

  // The crew sign-in box on the list page. Signing in or out reloads the recipes.
  let unmountCrew = null;
  function mountCrew(el) {
    if (unmountCrew) unmountCrew();
    unmountCrew = Cloud.mountAuth(el, { onChange: () => load().then(route).catch(e => toast(Cloud.friendly(e))) });
  }

  // =====================================================================
  // Grocery list view
  // =====================================================================
  // Adds up matching ingredients across the picked recipes: same thing + same kind of unit.
  function buildGroceries() {
    const lines = new Map(), loose = new Map();
    for (const [key, factor] of Object.entries(basket)) {
      const r = byKey(key); if (!r) continue;
      for (const line of flatIngredients(r)) {
        const p = parseIng(line);
        const base = (p.q1 == null ? line : p.name).split(',')[0].replace(/^of\s+/i, '').trim();
        const words = base.toLowerCase().split(/\s+/);
        if (!p.info) words[words.length - 1] = singularWord(words[words.length - 1]);
        const name = words.join(' ');
        if (p.q1 == null) {
          const e = loose.get(name) || { text: base, from: new Set() };
          e.from.add(r.title); loose.set(name, e);
          continue;
        }
        if (isMeasure(p)) {
          // add up in ml or g, so "6 tbsp" and "½ cup" of the same thing combine; things with a known
          // weight per cup are added by weight, so cups and grams of flour combine too
          const per = ML[p.info.canon] || G[p.info.canon];
          let dim = ML[p.info.canon] ? 'vol' : 'wt', lo = p.q1 * factor * per, hi = (p.q2 != null ? p.q2 : p.q1) * factor * per;
          const d = density(base);
          if (d && dim === 'vol') { lo = lo / ML.cup * d; hi = hi / ML.cup * d; dim = 'wt'; }
          const id = 'm' + dim + '|' + name;
          const e = lines.get(id) || { measure: true, dim, lo: 0, hi: 0, ranged: false, src: sysOf(p.info.canon), anyVol: false, text: base, from: new Set() };
          e.lo += lo; e.hi += hi;
          e.ranged = e.ranged || p.q2 != null;
          e.anyVol = e.anyVol || !!ML[p.info.canon];
          e.from.add(r.title);
          lines.set(id, e);
          continue;
        }
        const id = (p.info ? p.pre + p.info.canon : '') + '|' + name;
        const e = lines.get(id) || { lo: 0, hi: 0, ranged: false, info: p.info, pre: p.pre, unitRaw: p.unitRaw, text: base, from: new Set() };
        e.lo += p.q1 * factor;
        e.hi += (p.q2 != null ? p.q2 : p.q1) * factor;
        e.ranged = e.ranged || p.q2 != null;
        e.from.add(r.title);
        lines.set(id, e);
      }
    }
    const out = [];
    for (const [id, e] of lines) {
      if (e.measure) {
        const target = units === 'orig' ? e.src : units;
        // back to cups for US only if a recipe measured it by volume or in metric ("1 lb butter" stays in pounds)
        const m = measure(e.dim, e.lo, e.ranged ? e.hi : null, target, e.text, target === 'us' ? (e.anyVol || e.src === 'metric') : true);
        out.push({ id, sort: e.text.toLowerCase(), qty: m.text, name: e.text, from: [...e.from] });
        continue;
      }
      const top = e.ranged ? e.hi : e.lo;
      const qty = niceNum(e.lo) + (e.ranged ? '–' + niceNum(e.hi) : '');
      let unit = '';
      if (e.info) unit = SHOW[e.info.canon] ? SHOW[e.info.canon][top > 1 ? 1 : 0] : unitText(e.unitRaw, e.info, top);
      // with a unit, keep the name as written ("2 cups red lentils"); without one, count it ("3 eggs", "1 onion")
      const name = e.info ? e.text : countedName(e.text.replace(/\S+$/, w => singularWord(w)), top);
      out.push({ id, sort: e.text.toLowerCase(), qty: qty + (unit ? ' ' + e.pre + unit : ''), name, from: [...e.from] });
    }
    for (const [name, e] of loose) {
      if ([...lines.keys()].some(k => k.split('|')[1] === name)) continue;   // "salt" already on the list with an amount
      out.push({ id: '|' + name, sort: name, qty: '', name: e.text, from: [...e.from] });
    }
    return out.sort((a, b) => a.sort.localeCompare(b.sort));
  }
  function renderGroceries() {
    baseTitle = 'Grocery list · Family Recipes';
    const keys = Object.keys(basket).filter(byKey);
    if (!keys.length) {
      app.innerHTML = '<a class="back" href="#/">← All recipes</a><h1>Grocery list</h1>' +
        '<p class="muted">No recipes picked yet. Tap “+ List” on any recipe and its ingredients land here, added up with the others.</p>';
      return;
    }
    let got = new Set(store.get('got', []));
    const items = buildGroceries();
    app.innerHTML =
      '<a class="back" href="#/">← All recipes</a>' +
      '<div class="top"><div><h1>Grocery list</h1><p class="muted">' + items.length + ' things for ' + keys.length + ' recipe' + (keys.length === 1 ? '' : 's') + '</p></div>' +
      '<div class="btns no-print">' + unitsToggle() + '<button type="button" id="copy">Copy list</button><button type="button" id="print">Print</button><button type="button" id="uncheck">Untick all</button><button type="button" id="empty">Start over</button></div></div>' +
      '<div class="picked-list">' + keys.map(k => {
        const r = byKey(k), f = basket[k], base = Number(r.serves) || 0;
        const amount = base ? Math.round(base * f) + ' ' + esc(r.unit || 'servings') : (f === 0.5 ? '½' : f) + '× batch';
        return '<div class="picked-row" data-key="' + esc(k) + '"><a href="' + link(r) + '">' + esc(r.title) + '</a>' +
          '<span class="scale no-print"><button type="button" data-d="-1" aria-label="Less">−</button><output>' + amount + '</output><button type="button" data-d="1" aria-label="More">+</button></span>' +
          '<button type="button" class="rm no-print">Remove</button></div>';
      }).join('') + '</div>' +
      '<div class="panel" style="margin-top:16px"><ul class="groc" id="groc">' + items.map(it =>
        '<li data-id="' + esc(it.id) + '" class="' + (got.has(it.id) ? 'done' : '') + '"><span>' +
          (it.qty ? '<span class="qty">' + esc(it.qty) + '</span> ' : '') + esc(it.name) +
          (keys.length > 1 ? '<small>' + it.from.map(esc).join(', ') + '</small>' : '') + '</span></li>').join('') + '</ul>' +
      '<p class="hint no-print">Tap things off as they go in the cart. Amounts are added up across recipes where the units match.</p></div>' +
      '<footer><span>Your list is saved in this browser.</span><a href="../">Junk drawer</a></footer>';

    document.getElementById('groc').addEventListener('click', e => {
      const li = e.target.closest('li[data-id]'); if (!li) return;
      got.has(li.dataset.id) ? got.delete(li.dataset.id) : got.add(li.dataset.id);
      li.classList.toggle('done', got.has(li.dataset.id));
      store.set('got', [...got]);
    });
    app.querySelector('.picked-list').addEventListener('click', e => {
      const row = e.target.closest('.picked-row'); const b = e.target.closest('button'); if (!row || !b) return;
      const k = row.dataset.key, r = byKey(k), base = Number(r.serves) || 0;
      if (b.classList.contains('rm')) delete basket[k];
      else if (base) basket[k] = Math.max(1, Math.round(base * basket[k]) + Number(b.dataset.d)) / base;
      else { const steps = [0.5, 1, 2, 3, 4]; const i = steps.indexOf(basket[k]); basket[k] = steps[Math.max(0, Math.min(steps.length - 1, (i < 0 ? 1 : i) + Number(b.dataset.d)))]; }
      saveBasket(); renderGroceries();
    });
    document.getElementById('copy').addEventListener('click', () => {
      const text = 'Grocery list (' + keys.map(k => byKey(k).title).join(', ') + ')\n\n' +
        items.filter(it => !got.has(it.id)).map(it => '- ' + (it.qty ? it.qty + ' ' : '') + it.name).join('\n');
      (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject())
        .then(() => toast('List copied, paste it into notes or a message'), () => prompt('Copy this list:', text));
    });
    document.getElementById('print').addEventListener('click', () => window.print());
    app.querySelectorAll('[data-units]').forEach(b => b.addEventListener('click', () => { setUnits(b.dataset.units); renderGroceries(); }));
    document.getElementById('uncheck').addEventListener('click', () => { got = new Set(); store.set('got', []); renderGroceries(); });
    document.getElementById('empty').addEventListener('click', () => {
      if (!confirm('Clear the grocery list and take every recipe off it?')) return;
      basket = {}; store.set('got', []); saveBasket(); renderGroceries();
    });
  }

  // =====================================================================
  // Routing
  // =====================================================================
  function route() {
    const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean).map(decodeURIComponent);
    setTheme(null);
    if (parts[0] === 'c' && parts[1]) renderCollection(parts[1]);
    else if (parts[0] === 'list') renderGroceries();
    else if (parts.length === 2) renderRecipe(parts[0], parts[1]);
    else renderList();
    if (parts.length !== 2 && wake) { wantWake = false; setWake(false); }
    drawDock();
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', route);

  load().then(route).catch(err => {
    console.error(err);
    app.innerHTML = '<h1>Family Recipes</h1><p class="muted">Couldn’t load the recipes (' + esc(err.message || err) + '). ' +
      (location.protocol === 'file:' ? 'This page has to be opened from a web server, not straight from the file.' : '') + '</p>';
  });
  drawDock();
})();
</script>
</body>
