<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>The Church of Iron</title>
<meta name="description" content="A lifting log for a small crew. Keep the faith, log the set.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Chalk and iron: cool steel neutrals, competition-plate blue for actions, plate gold for PRs and clubs.
     Barlow Condensed for numbers and headings (gym-board lettering), Figtree for everything you read. */
  :root {
    --bg: #eef1f4; --card: #ffffff; --ink: #121820; --muted: #5b6674; --line: #dce2e9; --chip: #e9eef3;
    --accent: #2a5fd3; --accent-ink: #ffffff; --accent-soft: #e1eafb; --good: #1d8754; --gold: #a97a06; --gold-soft: #f7eed2;
    --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 10px 28px rgba(16, 24, 40, .08); --radius: 18px;
    --lift: 0 1px 2px rgba(16, 24, 40, .04);
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --seq-2: #9ec5f4; --seq-3: #5598e7; --seq-4: #2a78d6; --seq-5: #184f95; --grid: #e7ebf0; --axis: #c7cfd8;
    --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
    --body: Figtree, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1217; --card: #161b22; --ink: #e8edf3; --muted: #95a0ad; --line: #262d37; --chip: #1e252f;
      --accent: #6e9cff; --accent-ink: #0a1222; --accent-soft: #19253d; --good: #5cd197; --gold: #f0c04a; --gold-soft: #31280f;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 12px 32px rgba(0, 0, 0, .45); --lift: none; --s1: #3987e5; --s2: #d95926; --s3: #199e70; --seq-2: #184f95; --seq-3: #256abf; --seq-4: #3987e5; --seq-5: #86b6ef; --grid: #222a33; --axis: #36404c;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e1217; --card: #161b22; --ink: #e8edf3; --muted: #95a0ad; --line: #262d37; --chip: #1e252f;
    --accent: #6e9cff; --accent-ink: #0a1222; --accent-soft: #19253d; --good: #5cd197; --gold: #f0c04a; --gold-soft: #31280f;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 12px 32px rgba(0, 0, 0, .45); --lift: none; --s1: #3987e5; --s2: #d95926; --s3: #199e70; --seq-2: #184f95; --seq-3: #256abf; --seq-4: #3987e5; --seq-5: #86b6ef; --grid: #222a33; --axis: #36404c;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font: 16px/1.5 var(--body); min-height: 100dvh; -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }
  h1, h2, h3 { font-family: var(--display); margin: 0; line-height: 1.05; letter-spacing: .005em; font-weight: 700; text-wrap: balance; }
  .muted { color: var(--muted); }
  .num { font-variant-numeric: tabular-nums; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

  /* ---------- shell ---------- */
  #app { max-width: 560px; margin: 0 auto; padding: 0 16px calc(150px + env(safe-area-inset-bottom)); }
  .top { position: sticky; top: 0; z-index: 5; background: var(--bg); display: flex; align-items: center; justify-content: space-between; padding: calc(12px + env(safe-area-inset-top)) 0 10px; }
  .brand { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 800; font-size: 26px; letter-spacing: .01em; }
  .brand svg { width: 30px; height: 30px; }
  .iconbtn { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); display: grid; place-items: center; }
  .demo-flag { font-size: 12px; font-weight: 600; background: var(--gold-soft); color: var(--gold); border-radius: 99px; padding: 3px 10px; }

  .tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(12px); border-top: 1px solid var(--line); padding: 6px 12px calc(6px + env(safe-area-inset-bottom)); }
  .tabs > div:not(.nav-brand) { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
  .tabs a { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; border-radius: 12px; color: var(--muted); text-decoration: none; font-size: 11.5px; font-weight: 700; }
  .tabs a svg { width: 24px; height: 24px; }
  .tabs a[aria-current="page"] { color: var(--accent); }
  .tabs a[aria-current="page"] svg { background: var(--accent-soft); border-radius: 99px; padding: 2px 14px; width: 52px; }

  .fab { position: fixed; z-index: 7; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom)); border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 17px; padding: 16px 28px; border-radius: 99px; box-shadow: var(--shadow); display: flex; gap: 10px; align-items: center; }
  .fab:active { transform: translateX(-50%) scale(.97); }

  /* ---------- cards & bits ---------- */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-top: 14px; box-shadow: var(--lift); }
  .hero { padding: 18px; }
  .hero .date { font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .hero h1 { font-size: 40px; font-weight: 800; margin-top: 4px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; }
  .stat b { display: block; font-family: var(--display); font-size: 28px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .stat small { color: var(--muted); font-size: 12.5px; font-weight: 600; letter-spacing: .02em; }
  .chip { display: inline-flex; align-items: center; gap: 4px; background: var(--chip); border-radius: 10px; padding: 5px 10px; font-size: 14.5px; font-weight: 600; font-variant-numeric: tabular-nums; border: 0; }
  .chip.pr { background: var(--gold-soft); color: var(--gold); }
  .chip.warm { opacity: .6; }
  .chip small { font-weight: 500; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .ex-card h3 { font-size: 19px; }
  .ex-card .actions { display: flex; gap: 8px; margin-top: 12px; }
  .btn { border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 10px 14px; font-weight: 700; transition: background .15s, border-color .15s, transform .1s; }
  .btn:active { transform: scale(.98); }
  @media (hover: hover) { .btn:hover { border-color: var(--muted); } .btn.primary:hover { filter: brightness(1.06); border-color: var(--accent); } }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn.ghost { background: transparent; }
  .btn.block { width: 100%; padding: 15px; font-size: 17px; border-radius: 14px; }
  .btn:disabled { opacity: .5; cursor: default; }
  .empty { text-align: center; padding: 28px 12px 8px; }
  .empty svg { width: 160px; height: auto; }
  .empty h2 { font-size: 22px; margin-top: 6px; }
  .section-title { font-family: var(--display); font-size: 16px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 24px 4px 0; }

  /* ---------- history ---------- */
  .day { padding: 0; overflow: hidden; }
  .day > button { width: 100%; text-align: left; background: none; border: 0; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .day .when { font-weight: 700; }
  .day .meta { color: var(--muted); font-size: 14px; }
  .day .vol { font-family: var(--display); font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
  .day .body { border-top: 1px solid var(--line); padding: 4px 16px 14px; }
  .day .ex { margin-top: 12px; }
  .day .ex b { font-size: 15px; }
  .month { font-family: var(--display); font-size: 20px; margin: 26px 4px 0; }

  /* ---------- progress ---------- */
  .hill { width: 100%; height: auto; display: block; margin: 4px 0 6px; }
  .bar { height: 12px; background: var(--chip); border-radius: 99px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 45%, var(--gold))); border-radius: 99px; transition: width .6s; }
  .seg { display: inline-flex; background: var(--chip); border-radius: 12px; padding: 3px; gap: 2px; }
  .seg button { border: 0; background: transparent; border-radius: 9px; padding: 7px 12px; font-weight: 600; font-size: 14px; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  .badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; margin-top: 12px; }
  .badge { text-align: center; padding: 10px 6px; border-radius: 14px; background: var(--chip); font-size: 12.5px; font-weight: 600; }
  .badge .medal { font-size: 26px; line-height: 1.2; filter: grayscale(1); opacity: .35; }
  .badge.got { background: var(--gold-soft); color: var(--gold); }
  .badge.got .medal { filter: none; opacity: 1; }
  .best { padding: 12px 0; border-top: 1px solid var(--line); }
  .best:first-of-type { border-top: 0; }
  .search { width: 100%; padding: 13px 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); font-size: 16px; }

  /* ---------- sheet (logger / editor) ---------- */
  dialog { border: 0; padding: 0; background: transparent; color: inherit; max-width: none; max-height: none; width: 100%; height: 100%; margin: 0; }
  dialog::backdrop { background: rgba(15, 10, 5, .45); }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; max-width: 560px; margin: 0 auto; background: var(--bg); border-radius: 22px 22px 0 0; max-height: 92dvh; display: flex; flex-direction: column; box-shadow: var(--shadow); animation: up .22s ease-out; }
  @keyframes up { from { transform: translateY(40px); opacity: .4; } }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px 8px; }
  .sheet-head h2 { font-size: 22px; }
  .sheet-body { overflow: auto; padding: 4px 16px calc(18px + env(safe-area-inset-bottom)); }
  .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 8px auto 0; }
  .results { list-style: none; padding: 0; margin: 10px 0 0; }
  .results li button { width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 13px 14px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 10px; font-weight: 600; }
  .results li small { color: var(--muted); font-weight: 500; }
  .stepper { display: grid; grid-template-columns: 58px 1fr 58px; gap: 8px; align-items: center; }
  .stepper button { height: 58px; border-radius: 16px; border: 1px solid var(--line); background: var(--card); font-size: 26px; font-weight: 600; }
  .stepper input { height: 58px; width: 100%; text-align: center; border: 2px solid var(--line); border-radius: 16px; background: var(--card); font-family: var(--display); font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .stepper input:focus { border-color: var(--accent); outline: none; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stepper.sm { grid-template-columns: 44px 1fr 44px; gap: 6px; }
  .stepper.sm button { height: 54px; font-size: 22px; border-radius: 14px; }
  .stepper.sm input { height: 54px; font-size: 26px; min-width: 0; padding: 0; }
  .btn.big { padding: 16px; font-size: 18px; margin-top: 4px; }
  li.step-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: stretch; }
  .quick { width: 52px; border-radius: 14px; border: 1px solid var(--accent); background: var(--accent-soft); color: var(--accent); font-size: 22px; font-weight: 800; touch-action: manipulation; }
  .quick:disabled { opacity: .5; }
  .nudges { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-top: 8px; }
  .nudges button { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 8px 0; font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; user-select: none; touch-action: manipulation; }
  .nudges button:nth-child(-n+3) { color: var(--muted); }
  .stepper button { user-select: none; touch-action: manipulation; }
  .field-label { display: flex; justify-content: space-between; align-items: end; margin: 16px 2px 6px; font-weight: 600; }
  .field-label small { color: var(--muted); font-weight: 500; }
  .toggles { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .toggle { border: 1px solid var(--line); background: var(--card); border-radius: 99px; padding: 8px 14px; font-weight: 600; font-size: 14px; }
  .toggle[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .hint-line { font-size: 14px; color: var(--muted); margin-top: 6px; }
  .hint-line b { color: var(--ink); }
  .pr-flag { margin-top: 12px; padding: 10px 14px; border-radius: 14px; background: var(--gold-soft); color: var(--gold); font-weight: 700; display: flex; gap: 8px; align-items: center; animation: pop .35s ease-out; }
  @keyframes pop { 0% { transform: scale(.9); opacity: 0; } 70% { transform: scale(1.03); } }
  .plain-input { width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); }
  .warn { color: var(--accent); font-size: 14px; }

  /* ---------- routines ---------- */
  .tag { font-size: 12px; font-weight: 700; background: var(--accent-soft); color: var(--accent); border-radius: 99px; padding: 3px 10px; white-space: nowrap; }
  .routine h3 { font-size: 19px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .follow { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .follow h2 { font-size: 24px; margin-top: 2px; }
  .follow .date, .season .date, .plan-card .date { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
  ol.steps { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 8px; }
  .step { width: 100%; display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; text-align: left; background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; }
  .step .tick { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--chip); font-weight: 700; font-size: 14px; }
  .step .what { display: flex; flex-direction: column; min-width: 0; }
  .step .what small { color: var(--muted); font-size: 13.5px; }
  .step .count { font-weight: 700; color: var(--muted); }
  .step.next { border-color: var(--accent); background: var(--accent-soft); }
  .step.next .tick { background: var(--accent); color: var(--accent-ink); }
  .step.done { opacity: .7; }
  .step.done .tick { background: var(--good); color: #fff; }
  .title-input { flex: 1; min-width: 0; font-family: var(--display); font-size: 24px; font-weight: 800; border: 0; border-bottom: 2px dashed var(--line); background: transparent; padding: 4px 2px; }
  .title-input:focus { outline: none; border-bottom-color: var(--accent); }
  ol.items { list-style: none; margin: 14px 0 10px; padding: 0; display: grid; gap: 10px; }
  .item { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 10px 12px 12px; transition: box-shadow .15s, transform .15s; }
  .item.dragging { box-shadow: var(--shadow); transform: scale(1.02); border-color: var(--accent); position: relative; z-index: 2; }
  .item .grow { flex: 1; min-width: 0; }
  .handle { touch-action: none; cursor: grab; border: 0; background: var(--chip); border-radius: 10px; width: 34px; height: 34px; font-size: 18px; color: var(--muted); }
  .handle:active { cursor: grabbing; }
  .iconbtn.sm { width: 32px; height: 32px; font-size: 13px; }
  .mini { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: end; margin-top: 10px; }
  .ms { display: flex; flex-direction: column; gap: 3px; }
  .ms small { font-size: 12px; color: var(--muted); font-weight: 600; }
  .ms span { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--bg); }
  .ms button { border: 0; background: transparent; width: 34px; height: 38px; font-size: 18px; font-weight: 600; }
  .ms input { width: 52px; height: 38px; border: 0; background: transparent; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
  .mini-seg button { padding: 7px 9px; font-size: 13px; }
  .routine.updated { border-color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); }
  .tag.new { background: var(--gold-soft); color: var(--gold); }
  .plan-card { border-color: var(--accent); }
  .plan-card h2 { font-size: 24px; margin: 2px 0 0; }
  .plan-card .linkbtn { padding: 0; font-size: inherit; }
  .plan-row { padding: 10px 0; border-top: 1px solid var(--line); }
  .plan-row:first-child { border-top: 0; }
  .plan-row .iconbtn { margin-left: 4px; }
  .plan-row .row > span:last-child { display: flex; flex-shrink: 0; }
  .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 8px; }
  .days button { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 7px 0; font-size: 13px; font-weight: 700; color: var(--muted); touch-action: manipulation; }
  .days button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .goal-add.plan-add { grid-template-columns: 1fr auto; margin-top: 8px; }
  .plan-add select { min-width: 0; }
  .chunk { margin-top: 14px; }
  .chunk h3 { margin: 0; font-size: 17px; }
  .counts { margin: 12px 0 0; font-size: 14px; color: var(--muted); }
  .counts .linkbtn { padding: 0; font-size: 14px; color: var(--accent); font-weight: 700; }
  .flash { animation: flash 2.4s ease-out; }
  @keyframes flash { 0%, 30% { box-shadow: 0 0 0 3px var(--accent); } 100% { box-shadow: 0 0 0 0 transparent; } }
  .starter-btn { margin-top: 12px; }
  .starter-about { margin: 6px 0 0; font-size: 14.5px; }
  .week-list .row { padding: 6px 0; border-top: 1px solid var(--line); justify-content: flex-start; gap: 14px; }
  .week-list .row b { width: 40px; }
  .tip { margin: 6px 0 0; font-size: 14px; color: var(--muted); }
  .rest-bar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom)); z-index: 60; display: flex; gap: 8px; align-items: center;
    background: var(--ink); color: var(--bg); border-radius: 99px; padding: 8px 8px 8px 18px; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
  dialog .rest-bar { bottom: calc(16px + env(safe-area-inset-bottom)); }
  .rest-time { font-weight: 800; font-variant-numeric: tabular-nums; min-width: 92px; }
  .rest-bar button { white-space: nowrap; border: 0; border-radius: 99px; padding: 8px 12px; font-weight: 700; background: color-mix(in srgb, var(--bg) 18%, transparent); color: inherit; }
  .cal-card h2 { font-size: 20px; margin: 0; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 8px; }
  .cal-head span { text-align: center; font-size: 12px; color: var(--muted); font-weight: 700; }
  .cal-grid button { aspect-ratio: 1; border: 1px solid transparent; border-radius: 10px; background: var(--bg); font-weight: 600; font-size: 15px; position: relative; touch-action: manipulation; }
  .cal-grid button.done { background: var(--accent-soft); color: var(--accent); }
  .cal-grid button.planned::after { content: ""; position: absolute; left: 50%; bottom: 5px; width: 6px; height: 6px; margin-left: -3px; border-radius: 50%; background: var(--accent); }
  .cal-grid button.today { border-color: var(--accent); }
  .cal-grid button.sel { background: var(--accent); color: var(--accent-ink); }
  .cal-grid button.sel::after { background: var(--accent-ink); }
  .cal-key { font-size: 13px; color: var(--muted); margin: 10px 0 0; display: flex; gap: 6px; align-items: center; }
  .cal-key i { display: inline-block; width: 12px; height: 12px; border-radius: 4px; }
  .cal-key .k-done { background: var(--accent-soft); border: 1px solid var(--accent); }
  .cal-key .k-plan { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-left: 8px; }
  .cal-day h3 { margin: 0; }
  .head-actions { display: flex; gap: 8px; }
  .routine.block { border-style: dashed; }
  .btn.sm { padding: 6px 14px; font-size: 14px; }
  .day-row { padding: 8px 0; border-top: 1px solid var(--line); gap: 8px; }
  .day-row:first-child { border-top: 0; padding-top: 0; }
  .day-row > span:last-child { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 12px; }
  .cal button { border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 6px 0; display: flex; flex-direction: column; align-items: center; touch-action: manipulation; }
  .cal button small { font-size: 11px; color: var(--muted); }
  .cal button b { font-size: 17px; }
  .cal button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .cal button[aria-pressed="true"] small { color: inherit; }
  .cmp-wrap { overflow-x: auto; margin-top: 12px; }
  .cmp { width: 100%; border-collapse: collapse; font-size: 14px; }
  .cmp th, .cmp td { padding: 7px 6px; text-align: right; border-top: 1px solid var(--line); white-space: nowrap; }
  .cmp th:first-child, .cmp td:first-child { text-align: left; white-space: normal; }
  .cmp thead th { border-top: 0; color: var(--muted); font-size: 13px; }
  .cmp tr.grp th { text-align: left; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); padding-top: 14px; }
  .cmp td.lead { color: var(--accent); }
  .cmp td small { color: var(--muted); }
  .bw-chart { width: 100%; height: 70px; margin-top: 8px; display: block; }
  .goal-add.bw-add { grid-template-columns: 1fr auto auto; margin-top: 12px; align-items: center; }
  .crew-row { padding: 12px 0; border-top: 1px solid var(--line); }
  .crew-row:first-of-type { border-top: 0; }
  .crew-row.me b { color: var(--accent); }
  .crew-vol { font-family: var(--display); font-size: 30px; font-weight: 800; line-height: 1.1; margin: 2px 0 4px; }
  .changes { margin: 8px 0 0; padding: 8px 12px; border-radius: 12px; background: var(--gold-soft); font-size: 14px; }
  .tabs a { position: relative; }
  .tabs a.has-news::after { content: ""; position: absolute; top: 5px; right: calc(50% - 18px); width: 9px; height: 9px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 2px var(--bg); }
  .item-actions { display: flex; gap: 6px; margin-top: 10px; }
  .item-actions button { border: 0; background: var(--chip); border-radius: 9px; padding: 6px 10px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .results li button.sel { border-color: var(--accent); background: var(--accent-soft); }
  .tickbox { display: inline-grid; place-items: center; width: 24px; height: 24px; margin-right: 10px; border-radius: 7px; border: 2px solid var(--line); font-style: normal; font-size: 13px; font-weight: 800; vertical-align: -6px; }
  .sel .tickbox { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .pick-foot { position: sticky; bottom: 0; padding: 10px 0 4px; background: linear-gradient(transparent, var(--bg) 30%); }
  /* ---------- routine editor, phone-first ---------- */
  #sheetInner { display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; }
  #sheetInner .sheet-body { flex: 1 1 auto; min-height: 0; overflow: auto; overscroll-behavior: contain; }
  .sheet.tall { height: 94dvh; max-height: 94dvh; }
  .design-body { flex: 1; padding-bottom: 12px; }
  .design-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  #rtNotes { margin-bottom: 4px; resize: vertical; }
  .design-foot { display: grid; grid-template-columns: 1fr 1.25fr auto; gap: 8px; padding: 10px 16px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: var(--bg); }
  .design-foot .btn { padding: 14px 8px; font-size: 15px; border-radius: 14px; white-space: nowrap; }
  .item { padding: 0; overflow: hidden; }
  .item-head { display: flex; align-items: center; gap: 6px; padding: 6px 10px 6px 6px; }
  .item-head .handle { width: 40px; height: 44px; flex: none; background: transparent; font-size: 20px; }
  .item-sum { flex: 1; min-width: 0; text-align: left; border: 0; background: transparent; padding: 8px 4px; display: flex; flex-direction: column; gap: 1px; }
  .item-sum b { font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item-sum .sum { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .chev { color: var(--muted); font-size: 14px; width: 18px; text-align: center; }
  .item.open { border-color: var(--accent); }
  .item.open .item-sum .sum { color: var(--accent); font-weight: 600; }
  .item-edit { padding: 4px 14px 14px; border-top: 1px solid var(--line); }
  .item-edit .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .bs { display: flex; flex-direction: column; gap: 4px; }
  .bs.wide { margin-top: 8px; }
  .bs small { font-size: 12.5px; color: var(--muted); font-weight: 600; }
  .bs span { display: grid; grid-template-columns: 46px 1fr 46px; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--bg); }
  .bs button { border: 0; background: transparent; height: 50px; font-size: 22px; font-weight: 600; user-select: none; touch-action: manipulation; }
  .bs button:active { background: var(--chip); }
  .bs input { min-width: 0; border: 0; background: transparent; text-align: center; font-family: var(--display); font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .item-edit .nudges { grid-template-columns: repeat(4, 1fr); }
  .item-edit .item-actions { margin-top: 12px; }
  .item-actions .danger, .linkbtn.danger { color: var(--accent); }
  .linkbtn { border: 0; background: none; padding: 10px 2px; font-weight: 600; font-size: 14px; }
  .empty-steps { padding: 18px 8px; text-align: center; color: var(--muted); line-height: 1.6; }
  /* ---------- seasons ---------- */
  .season.on { border-color: var(--accent); }
  .season h3 { font-size: 19px; }
  .goal { margin-top: 10px; }
  .goal .row { font-size: 14px; font-weight: 600; margin-bottom: 5px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .goal-add { display: grid; grid-template-columns: 1.3fr 1fr auto; gap: 8px; }
  .goal-row { padding: 8px 2px; border-bottom: 1px solid var(--line); }


  /* ---------- charts ---------- */
  .chart { width: 100%; height: auto; display: block; margin-top: 8px; overflow: visible; }
  .chart .grid { stroke: var(--grid); stroke-width: 1; }
  .chart .axis { stroke: var(--axis); stroke-width: 1; }
  .chart .tick { fill: var(--muted); font: 600 11px var(--body); }
  .chart .endlab { fill: var(--ink); font: 700 12px var(--body); }
  .chart .hit { fill: transparent; cursor: crosshair; }
  .chart .hx .cross { stroke: var(--axis); stroke-width: 1; opacity: 0; }
  .chart .hx:hover .cross { opacity: 1; }
  .heat { max-width: 460px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i, .tip-pop i, .who i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .legend.scale { gap: 4px; align-items: center; font-weight: 500; font-size: 12px; }
  .legend.scale i { width: 12px; height: 12px; }
  .tip-pop { position: fixed; z-index: 100; pointer-events: none; background: var(--ink); color: var(--bg); border-radius: 10px; padding: 8px 10px; font-size: 13px; line-height: 1.45; box-shadow: var(--shadow); max-width: 240px; }
  .tip-pop i { margin-right: 6px; vertical-align: -1px; }
  .spark { width: 100%; height: 32px; display: block; margin-top: 8px; }
  .card-title { font-family: var(--display); font-size: 21px; font-weight: 700; margin: 0; }
  .card-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .trend-pick { width: auto; max-width: 60%; padding: 8px 12px; font-weight: 600; }
  .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  .kpi { margin-top: 0; padding: 14px; display: flex; flex-direction: column; min-width: 0; }
  .kpi small { font-size: 12.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .kpi b { font-family: var(--display); font-size: 34px; font-weight: 800; line-height: 1.05; margin-top: 4px; }
  .kpi .kpi-sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .kpis .kpi:first-child { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .kpis .kpi:first-child small, .kpis .kpi:first-child .kpi-sub { color: inherit; opacity: .85; }
  .kpis .kpi:first-child .spark polyline { stroke: currentColor; }
  table.lifts { margin-top: 10px; }
  table.lifts td small { display: inline; }
  .rank { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; background: var(--chip); font-size: 12px; font-weight: 800; margin-right: 8px; }
  .clubs .hill { max-height: 150px; }
  .clubs .badges { grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); }

  /* ---------- seasons ---------- */
  .page-actions { flex-wrap: wrap; margin-top: 8px; }
  .page-actions p { flex: 1 1 240px; }
  .season-grid { display: grid; gap: 14px; margin-top: 12px; }
  .sbanner { padding: 0; overflow: hidden; margin-top: 0; }
  .sbanner .band { background: var(--band); color: #fff; padding: 16px 16px 14px; background-image: linear-gradient(135deg, rgba(255,255,255,.14), transparent 55%); }
  .sbanner .band h2 { font-size: 30px; font-weight: 800; margin-top: 10px; color: #fff; }
  .sbanner .band h1 { font-size: 44px; font-weight: 800; margin-top: 10px; color: #fff; }
  .sbanner .band p { margin: 2px 0 0; opacity: .85; font-weight: 600; font-size: 14px; }
  .band-top { display: flex; justify-content: space-between; gap: 8px; align-items: center; flex-wrap: wrap; }
  .band-who { font-size: 13px; font-weight: 700; opacity: .85; }
  .pill { font-size: 12px; font-weight: 800; padding: 4px 10px; border-radius: 99px; background: rgba(255,255,255,.2); letter-spacing: .02em; }
  .pill.live { background: #fff; color: #0f1720; }
  .elapsed { height: 6px; border-radius: 99px; background: rgba(255,255,255,.25); margin-top: 12px; overflow: hidden; }
  .elapsed i { display: block; height: 100%; background: #fff; border-radius: 99px; }
  .sb-body { padding: 14px 16px 16px; }
  .sb-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .sb-stats b { display: block; font-family: var(--display); font-size: 26px; font-weight: 800; line-height: 1.05; }
  .sb-stats small { color: var(--muted); font-size: 12.5px; font-weight: 600; }
  .sbanner .actions { margin-top: 12px; }
  .sbanner.big { margin-top: 10px; }
  .linkbtn.back { padding: 6px 0 0; color: var(--muted); }
  .goal-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; margin-top: 12px; }
  .goal-tile { border: 1px solid var(--line); border-radius: 14px; padding: 12px; background: var(--bg); }
  .goal-tile.done { border-color: var(--good); background: color-mix(in srgb, var(--good) 8%, var(--bg)); }
  .gt-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
  .gt-head small { flex-basis: 100%; margin-left: 34px; margin-top: -4px; }
  .gt-icon { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; background: var(--card); font-size: 14px; }
  .gt-row { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; margin-top: 8px; font-size: 13.5px; font-weight: 600; }
  .gt-bar { grid-column: 1 / -1; height: 8px; border-radius: 99px; background: var(--chip); overflow: hidden; }
  .gt-bar i { display: block; height: 100%; border-radius: 99px; }
  .who { display: inline-flex; align-items: center; gap: 6px; }
  .cmp.standings td, .cmp.standings th { font-size: 14.5px; }
  .cmp tr.me td { font-weight: 700; }
  .plan-list { margin: 10px 0 0; padding-left: 20px; display: grid; gap: 8px; }
  .plan-list small { display: block; color: var(--muted); }
  .step-note { margin-top: 10px; font-size: 14px; padding: 10px 12px; }

  /* ---------- page title (desktop) and nav extras ---------- */
  .page-title, .nav-brand, .nav-log { display: none; }

  /* ---------- desktop: sidebar, wide grid, centered dialogs ---------- */
  @media (min-width: 960px) {
    :root { --side: 248px; }
    body { padding-left: var(--side); }
    #app { max-width: 1180px; padding: 0 40px 56px; }
    .top { padding: 28px 0 18px; }
    .top .brand { display: none; }
    .page-title { display: block; font-size: 40px; font-weight: 800; }

    .tabs { top: 0; bottom: 0; right: auto; width: var(--side); padding: 26px 16px; border-top: 0; border-right: 1px solid var(--line); background: var(--card); backdrop-filter: none;
      display: flex; flex-direction: column; gap: 22px; }
    .nav-brand { display: flex; padding: 0 10px; }
    .tabs > div:not(.nav-brand) { max-width: none; margin: 0; display: flex; flex-direction: column; gap: 4px; }
    .tabs a { flex-direction: row; gap: 12px; padding: 11px 12px; font-size: 16px; border-radius: 12px; }
    .tabs a svg { width: 22px; height: 22px; }
    .tabs a[aria-current="page"] { background: var(--accent-soft); }
    .tabs a[aria-current="page"] svg { background: none; padding: 0; width: 22px; }
    @media (hover: hover) { .tabs a:not([aria-current="page"]):hover { background: var(--chip); color: var(--ink); } }
    .tabs a.has-news::after { top: 50%; right: 12px; margin-top: -4px; }
    .nav-log { display: flex; justify-content: center; gap: 8px; align-items: center; border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 800; font-size: 16px; padding: 14px; border-radius: 14px; box-shadow: var(--shadow); }
    .fab { display: none !important; }

    /* The view becomes a 12-column grid. Everything spans the full width unless it's a card that reads
       well side by side. */
    #view { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 18px; align-items: start; }
    #view > * { grid-column: 1 / -1; margin-top: 0; }
    #view > .section-title, #view > h2.month { margin: 12px 4px -6px; }
    #view > .hero { grid-column: span 7; }
    #view > .hero:only-of-type, #view > .seg + .hero { grid-column: 1 / -1; }
    #view > .hero + .plan-card, #view > .hero + .follow, #view > .hero + .card.empty { grid-column: span 5; }
    #view > .plan-card + .plan-card { grid-column: span 5; }
    #view > .ex-card, #view > .routine, #view > .season, #view > .day { grid-column: span 6; }
    #view > .cal-card { grid-column: span 7; }
    #view > .cal-day { grid-column: span 5; }
    #view > .coming { grid-column: span 12; }
    #view > .bw { grid-column: span 12; }
    .hero h1 { font-size: 56px; }
    .hero .stats { gap: 18px; }
    .stat b { font-size: 34px; }
    .badges { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
    .hill { max-height: 240px; }
    #view > .row:first-child > h2 { display: none; }
    #view > .row:first-child { justify-content: flex-end; }
    #view > .kpis { margin-top: 0; grid-template-columns: repeat(4, 1fr); gap: 18px; }
    #view > .c-wide { grid-column: span 8; }
    #view > .c-side { grid-column: span 4; }
    #view > .c-half { grid-column: span 6; }
    #view > .c-full { grid-column: 1 / -1; }
    #view > .season-grid { grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 18px; margin-top: 0; }
    #view > .linkbtn.back { margin-bottom: -8px; }
    .sbanner.big .band { padding: 22px 24px 18px; }
    .sbanner.big .band h1 { font-size: 56px; }
    .kpi b { font-size: 40px; }
    .page-actions { margin-top: 0; }
    .cal-grid button { font-size: 16px; }

    /* Sheets open as centered dialogs instead of sliding up from the bottom. */
    dialog::backdrop { background: rgba(10, 14, 20, .5); backdrop-filter: blur(2px); }
    .sheet { top: 0; bottom: 0; left: var(--side); right: 0; margin: auto; width: min(640px, calc(100vw - var(--side) - 64px)); height: fit-content; max-height: 88dvh;
      border-radius: 22px; animation: pop-in .18s ease-out; }
    .sheet.tall { height: 88dvh; max-height: 88dvh; }
    .grab { display: none; }
    .sheet-head { padding: 20px 22px 10px; }
    .sheet-body { padding: 4px 22px 22px; }
    .design-foot { padding: 12px 22px 16px; border-radius: 0 0 22px 22px; }
    @keyframes pop-in { from { transform: scale(.97); opacity: 0; } }

    #toast { left: calc(50% + var(--side) / 2); bottom: 28px; }
    .rest-bar { left: calc(50% + var(--side) / 2); bottom: 28px; }
  }
  @media (min-width: 1360px) {
    #view > .routine, #view > .season { grid-column: span 4; }
  }

  /* ---------- toast ---------- */
  #toast { position: fixed; z-index: 20; left: 50%; bottom: calc(150px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px); opacity: 0; pointer-events: none; transition: .2s; background: var(--ink); color: var(--bg); border-radius: 14px; padding: 11px 12px 11px 16px; display: flex; gap: 12px; align-items: center; box-shadow: var(--shadow); width: max-content; max-width: calc(100vw - 32px); font-weight: 600; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  #toast button { border: 0; background: color-mix(in srgb, var(--bg) 18%, transparent); color: var(--bg); border-radius: 10px; padding: 6px 12px; font-weight: 700; }
  dialog #toast { top: calc(16px + env(safe-area-inset-top)); bottom: auto; transform: translate(-50%, -20px); }
  dialog #toast.show { transform: translate(-50%, 0); }

  /* ---------- sign in ---------- */
  .gate { max-width: 400px; margin: 0 auto; padding: calc(48px + env(safe-area-inset-top)) 20px 40px; }
  .gate .brand { font-size: 30px; justify-content: center; }
  .gate .brand svg { width: 44px; height: 44px; }
  .gate p { text-align: center; }
  .gate form { margin-top: 22px; display: grid; gap: 10px; }
  .gate label { font-weight: 600; font-size: 14px; }
  .gate .qr { display: block; margin: 12px auto; width: 200px; height: 200px; background: #fff; border-radius: 12px; padding: 8px; }
  .gate code { display: block; text-align: center; font-size: 13px; word-break: break-all; background: var(--chip); padding: 8px; border-radius: 10px; }
  .code-input { text-align: center; letter-spacing: .4em; font-size: 26px !important; font-weight: 700; }
</style>
</head>
<body>
<div id="gate" class="gate" hidden></div>

<div id="app" hidden>
  <header class="top">
    <div class="brand"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="17" fill="var(--accent)"/><circle cx="20" cy="20" r="11.5" fill="none" stroke="var(--accent-ink)" stroke-width="2" opacity=".55"/><circle cx="20" cy="20" r="4.5" fill="var(--bg)"/></svg>The Church of Iron <span class="demo-flag" id="demoFlag" hidden>Demo</span></div>
    <h1 class="page-title" id="pageTitle">Today</h1>
    <button class="iconbtn" id="menuBtn" aria-label="Settings"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></button>
  </header>
  <main id="view" aria-live="polite"></main>
</div>

<nav class="tabs" id="tabs" hidden aria-label="Sections">
  <div class="brand nav-brand"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="17" fill="var(--accent)"/><circle cx="20" cy="20" r="11.5" fill="none" stroke="var(--accent-ink)" stroke-width="2" opacity=".55"/><circle cx="20" cy="20" r="4.5" fill="var(--bg)"/></svg>The Church of Iron</div>
  <button class="nav-log" id="navLog" type="button"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Log a set</button>
  <div>
  <a href="#log"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6v12M18 6v12M3 9v6M21 9v6M6 12h12"/></svg>Log</a>
  <a href="#routines"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg>Routines</a>
  <a href="#history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Calendar</a>
  <a href="#seasons"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4"/></svg>Seasons</a>
  <a href="#progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 20 L21 8"/><circle cx="15" cy="9" r="3.5"/></svg>Progress</a>
</div></nav>

<button class="fab" id="fab" hidden><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Log a set</button>

<dialog id="sheet" aria-labelledby="sheetTitle"><div class="sheet"><div class="grab"></div><div id="sheetInner"></div></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script type="module" src="app.js"></script>
</body>
</html>
