<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Junk Drawer</title>
<style>
  :root { --bg: #f7f5f0; --card: #fff; --ink: #222; --muted: #6b665c; --line: #e4dfd4; --accent: #b5652a; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #1b1916; --card: #24211d; --ink: #eee8dd; --muted: #a59d8f; --line: #38332c; --accent: #e08a48; }
  }
  :root[data-theme="dark"] { --bg: #1b1916; --card: #24211d; --ink: #eee8dd; --muted: #a59d8f; --line: #38332c; --accent: #e08a48; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 40px 16px; }
  h1 { margin: 0 0 4px; }
  p { color: var(--muted); margin: 0 0 24px; }
  ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
  a { display: block; padding: 16px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; color: inherit; text-decoration: none; }
  a:hover, a:focus-visible { border-color: var(--accent); }
  a b { display: block; }
  a span { color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>The Junk Drawer</h1>
  <p>Little things, hosted.</p>
  <ul>
    <li><a href="piroshki/"><b>Words for Piroshki</b><span>NaNoWriMo tracker for two stories. Hit both goals, earn a tray of piroshki.</span></a></li>
  </ul>
</main>
</body>
</html>
